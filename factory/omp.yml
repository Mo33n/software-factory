# Overlay loaded only for factory/bin/agent runs. Does not change ~/.omp.
# Unattended: no ask prompts, no extra advisor (the factory already reviews),
# no autolearn, no web search. Local weights stay on this machine.
tools:
  approvalMode: yolo
  format: qwen3
ask:
  enabled: false
advisor:
  enabled: false
autolearn:
  enabled: false
web_search:
  enabled: false
bash:
  gitGuard: true
